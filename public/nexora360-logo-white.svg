<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <defs>
    <linearGradient id="nexoraGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA040" />
    </linearGradient>
    <linearGradient id="nexoraGradWhite2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA040" />
      <stop offset="100%" stop-color="#FF4D4D" />
    </linearGradient>
    <filter id="glowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B35" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 360 Degree Orbital Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer Arc -->
    <path d="M 32,4 A 28,28 0 1,1 12,52" fill="none" stroke="url(#nexoraGradWhite)" stroke-width="5" stroke-linecap="round" filter="url(#glowWhite)"/>
    <!-- Inner Counter Arc -->
    <path d="M 32,60 A 28,28 0 0,1 52,12" fill="none" stroke="url(#nexoraGradWhite2)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Central 360 core dot -->
    <circle cx="32" cy="32" r="13" fill="url(#nexoraGradWhite)"/>
    <!-- Inner bright center -->
    <circle cx="32" cy="32" r="6" fill="#FFFFFF"/>
    <!-- Small orbiting dot -->
    <circle cx="48" cy="16" r="3.5" fill="#FF4D4D"/>
    <circle cx="16" cy="48" r="3" fill="#FFA040"/>
  </g>

  <!-- Brand Typography (White text for dark backgrounds) -->
  <g transform="translate(78, 12)">
    <!-- NEXORA -->
    <text x="0" y="32" font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="0.5" fill="#FFFFFF">
      NEXORA<tspan fill="url(#nexoraGradWhite)">360</tspan>
    </text>
    <!-- GLOBAL SOLUTIONS -->
    <text x="1.5" y="48" font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4" fill="#E2E8F0">
      GLOBAL SOLUTIONS
    </text>
  </g>
</svg>
