<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <defs>
    <linearGradient id="nexoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="nexoraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5722" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 360 Degree Orbital Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer Arc -->
    <path d="M 32,4 A 28,28 0 1,1 12,52" fill="none" stroke="url(#nexoraGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Inner Counter Arc -->
    <path d="M 32,60 A 28,28 0 0,1 52,12" fill="none" stroke="url(#nexoraGrad2)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Central 360 core dot -->
    <circle cx="32" cy="32" r="13" fill="url(#nexoraGrad)"/>
    <!-- Inner bright center -->
    <circle cx="32" cy="32" r="6" fill="#FFFFFF"/>
    <!-- Small orbiting dot -->
    <circle cx="48" cy="16" r="3.5" fill="#DC2626"/>
    <circle cx="16" cy="48" r="3" fill="#F97316"/>
  </g>

  <!-- Brand Typography (Dark for light backgrounds) -->
  <g transform="translate(78, 12)">
    <!-- NEXORA -->
    <text x="0" y="32" font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="0.5" fill="#0F172A">
      NEXORA<tspan fill="url(#nexoraGrad)">360</tspan>
    </text>
    <!-- GLOBAL SOLUTIONS -->
    <text x="1.5" y="48" font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4" fill="#64748B">
      GLOBAL SOLUTIONS
    </text>
  </g>
</svg>
